<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>الاشتراكات - إدارة الشرائح</title>
<style>
:root {
  --bg: #0f161c; --surface: #172029; --surface-card: #1e2936; --fg: #e6edf3; --muted: #93a2b1; --line: #263440;
  --accent: #4fb3d1; --accent-fg: #062029; --accent-soft: #14323d;
  --on: #6fd49a; --on-bg: #14341f; --hold: #f0c261; --hold-bg: #3a2c0c; --off: #f08a8a; --off-bg: #3d1a1a;
  --danger: #f2877f; --shadow: 0 10px 30px rgba(0,0,0,.5);
  --font: system-ui, "Segoe UI", Roboto, Tahoma, sans-serif;
  --mono: ui-monospace, Consolas, "Roboto Mono", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; padding: 14px; padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-block: 10px 12px; display: grid; gap: 12px; }
.titlebar { display: flex; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--fg); }
.sub { color: var(--muted); font-size: .82rem; margin-top: 2px; }
.btns { display: flex; gap: 8px; align-items: center; }
.btn-icon { width: 44px; height: 44px; background: var(--accent); color: var(--accent-fg); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; box-shadow: 0 4px 12px rgba(79,179,209,.3); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; font-size: .9rem; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: var(--danger); }

.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; font-size: 1rem; color: var(--fg); }
.search input::placeholder { color: var(--muted); }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); }
.tab b { font-family: var(--mono); font-weight: 600; font-size: .8rem; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tab[aria-pressed="true"] b { color: inherit; }

.section-title { font-size: .85rem; color: var(--muted); font-weight: 600; margin-block: 10px 6px; display: flex; justify-content: space-between; }

/* Cards list */
.list { display: grid; gap: 12px; }
.card { background: var(--surface-card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.2); position: relative; }
.card.due { border-color: var(--hold); background: color-mix(in srgb, var(--hold-bg) 20%, var(--surface-card)); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.phone-lg { font-family: var(--mono); font-size: 1.25rem; font-weight: 700; direction: ltr; text-align: right; letter-spacing: 0.5px; }
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.badge.active { background: var(--on-bg); color: var(--on); }
.badge.suspended { background: var(--hold-bg); color: var(--hold); }
.badge.disconnected { background: var(--off-bg); color: var(--off); }
.badge.days { background: var(--accent-soft); color: var(--accent); margin-inline-end: auto; }

.card-body { display: grid; gap: 4px; font-size: .9rem; }
.name-row { font-weight: 600; font-size: 1.05rem; display: flex; justify-content: space-between; }
.sim-row { font-family: var(--mono); font-size: .85rem; color: var(--muted); direction: ltr; text-align: right; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.meta-row { display: flex; gap: 12px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; margin-top: 2px; }
.date-row { font-size: .85rem; color: var(--fg); border-top: 1px solid var(--line); padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
.date-val { font-family: var(--mono); direction: ltr; color: var(--muted); }

/* Card Actions */
.card-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
.action-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 4px; font-size: .82rem; font-weight: 500; text-align: center; color: var(--fg); display: flex; align-items: center; justify-content: center; gap: 4px; }
.action-btn.wa { border-color: var(--on); color: var(--on); background: color-mix(in srgb, var(--on-bg) 30%, transparent); }
.action-btn.call { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.action-btn.sms { border-color: var(--hold); color: var(--hold); background: color-mix(in srgb, var(--hold-bg) 30%, transparent); }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }

/* Modals */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(8,18,26,.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 14px; }
.overlay[hidden] { display: none; }
.dlg { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 20px; display: grid; gap: 14px; border: 1px solid var(--line); }
.dlg h2 { margin: 0; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
.field { display: grid; gap: 5px; }
.field label { font-size: .82rem; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 14px; color: var(--fg); font-size: .95rem; }
.field textarea { min-height: 80px; resize: vertical; }
.field input.ltr, .field textarea.ltr { direction: ltr; text-align: right; font-family: var(--mono); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.actions .spacer { flex: 1; }
.hint { color: var(--muted); font-size: .8rem; margin: 0; line-height: 1.4; }
.toast { position: fixed; bottom: 20px; left: 50%变成了translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 20px; border-radius: 10px; z-index: 40; font-size: .9rem; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transform: translateX(-50%); animation: fadeInOut 2.5s ease forwards; }
@keyframes fadeInOut { 0%{opacity:0; transform:translate(-50%,20px);} 15%{opacity:1; transform:translate(-50%,0);} 85%{opacity:1; transform:translate(-50%,0);} 100%{opacity:0; transform:translate(-50%,20px);} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="titlebar">
      <div>
        <h1>الاشتراكات</h1>
        <div class="sub" id="summary">جاري تحميل البيانات...</div>
      </div>
      <div class="btns">
        <button class="btn" id="setBtn" type="button">الإعدادات</button>
        <button class="btn-icon" id="addBtn" type="button" aria-label="إضافة شريحة">+</button>
      </div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="ابحث برقم الهاتف، رقم الشريحة، أو اسم الزبون..." autocomplete="off">
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main>
    <div class="list" id="list"></div>
  </main>
</div>

<!-- Add / Edit Modal -->
<div class="overlay" id="overlay" hidden>
  <form class="dlg" id="form" novalidate>
    <h2 id="dlgTitle">إضافة شريحة جديدة <button class="btn" type="button" id="closeDlg" style="padding:4px 10px;font-size:.8rem;">إغلاق</button></h2>
    <div class="field">
      <label for="f-name">اسم الزبون</label>
      <input id="f-name" type="text" autocomplete="off" placeholder="مثال: أحمد محمد">
    </div>
    <div class="two">
      <div class="field">
        <label for="f-phone">رقم الهاتف</label>
        <input id="f-phone" class="ltr" type="text" inputmode="numeric" placeholder="05XXXXXXXX" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-company">شركة الاتصالات</label>
        <select id="f-company">
          <option value="">اختر الشركة</option>
          <option>سلكوم</option>
          <option>هوت موبايل</option>
          <option>بلفون</option>
          <option>بارتنر</option>
          <option>رامي ليفي</option>
          <option>019</option>
          <option>ألوها</option>
          <option>أخرى</option>
        </select>
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label for="f-sim">رقم الشريحة (SIM)</label>
        <input id="f-sim" class="ltr" type="text" inputmode="numeric" placeholder="8997..." autocomplete="off">
      </div>
      <div class="field">
        <label for="f-activation">مكان التفعيل</label>
        <select id="f-activation">
          <option value="">اختر المكان</option>
          <option>ألوها</option>
          <option>كويك لاين</option>
          <option>أرين</option>
          <option>سكاي</option>
          <option>توب أب</option>
          <option>مسار</option>
          <option>أخرى</option>
        </select>
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label for="f-status">الحالة</label>
        <select id="f-status">
          <option value="active">مفعل</option>
          <option value="suspended">معلق</option>
          <option value="disconnected">مفصول</option>
        </select>
      </div>
      <div class="field">
        <label for="f-simstate">نوع الشريحة</label>
        <select id="f-simstate">
          <option value="used-sim">مستعملة</option>
          <option value="clear-sim">نظيفة</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-date">موعد الفصل</label>
      <input id="f-date" type="date">
    </div>
    <div class="field">
      <label for="f-notes">ملاحظات</label>
      <textarea id="f-notes" placeholder="ملاحظات إضافية عن العضو أو الاشتراك..."></textarea>
    </div>
    <div style="color:var(--danger);font-size:.85rem;" id="err"></div>
    <div class="actions">
      <button class="btn primary" type="submit" style="flex:2;">حفظ البيانات</button>
      <button class="btn danger" type="button" id="delBtn" hidden>حذف</button>
    </div>
  </form>
</div>

<!-- Settings Modal -->
<div class="overlay" id="setOverlay" hidden>
  <div class="dlg">
    <h2>الإعدادات العامة <button class="btn" type="button" id="setClose" style="padding:4px 10px;font-size:.8rem;">إغلاق</button></h2>
    
    <div class="field">
      <label for="s-template">قالب رسالة التذكير (SMS)</label>
      <textarea id="s-template" class="ltr" style="direction:rtl; text-align:right;">مرحباً {name}، نذّرك بأن موعد فصل الشريحة {phone} هو {date}. للتجديد يرجى التواصل معنا. شكراً.</textarea>
      <p class="hint">المتغيرات المتاحة: <code>{name}</code> للاسم، <code>{phone}</code> للرقم، <code>{date}</code> لموعد الفصل.</p>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label>إدارة النسخ الاحتياطي والملفات</label>
      <div style="display: grid; gap: 8px; margin-top: 6px;">
        <button class="btn" type="button" id="expCSV">تصدير ملف Excel / CSV</button>
        <button class="btn" type="button" id="expJSON">تصدير نسخة احتياطية كاملة (JSON)</button>
        <button class="btn" type="button" id="impBtn">استيراد بيانات ودمجها</button>
        <input id="impFile" type="file" accept=".json,.csv" hidden>
      </div>
      <p class="hint" style="margin-top:4px;">يمكنك تصدير ملف الـ CSV وفتحه مباشرة عبر برنامج Excel على جهازك.</p>
    </div>

    <div style="text-align:center; color:var(--muted); font-size:.8rem; margin-top:10px;">
      البيانات محفوظة محلياً على هاتفك بأمان تام وتعمل بدون إنترنت.
    </div>
  </div>
</div>

<script>
(function() {
  var STORAGE_KEY = "sim_subscriptions_v3";
  var STATUS = { active: "مفعل", suspended: "معلق", disconnected: "مفصول" };
  var ORDER = ["active", "suspended", "disconnected"];
  
  var docs = new Map();
  var filter = "all", query = "", editingId = null, delArmed = false;
  
  var defaultSMSTemplate = "مرحباً {name}، نذّرك بأن موعد فصل الشريحة {phone} هو {date}. للتجديد يرجى التواصل معنا. شكراً.";
  var smsTemplate = localStorage.getItem("sim_sms_tmpl") || defaultSMSTemplate;

  var $ = function(id) { return document.getElementById(id); };

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        JSON.parse(raw).forEach(function(r) { docs.set(r._id, r); });
      } else {
        // بيانات تجريبية أولية مطابقة للمواصفات
        var sample = [
          { _id: "s1", phone: "0524392489", sim: "899700224989972020", name: "أحمد علي", company: "سلكوم", activation: "ألوها", status: "active", simState: "used-sim", cutDate: "2026-10-18", notes: "" },
          { _id: "s2", phone: "0535673845", sim: "8997207105106265389", name: "ضبة هوت", company: "هوت موبايل", activation: "كويك لاين", status: "active", simState: "used-sim", cutDate: "2026-10-18", notes: "" },
          { _id: "s3", phone: "0507485352", sim: "8997250400047527708", name: "محمد خالد", company: "بلفون", activation: "سكاي", status: "active", simState: "used-sim", cutDate: "2026-10-19", notes: "" }
        ];
        sample.forEach(function(r) { docs.set(r._id, r); });
        saveData();
      }
    } catch(e) { docs = new Map(); }
    checkAutoDisconnect();
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(docs.values())));
    } catch(e) { toast("تعذر الحفظ، مساحة التخزين ممتلئة!"); }
  }

  function toast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 2500);
  }

  function checkAutoDisconnect() {
    var today = new Date().toISOString().slice(0, 10);
    var changed = false;
    docs.forEach(function(r) {
      if (r.status === "active" && r.cutDate && r.cutDate <= today) {
        r.status = "disconnected";
        changed = true;
      }
    });
    if (changed) saveData();
  }

  function daysFrom(iso) {
    if (!iso) return null;
    var t = new Date(), nowUTC = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
    var p = iso.split("-").map(Number);
    if (p.length < 3) return null;
    var targetUTC = Date.UTC(p[0], p[1]-1, p[2]);
    return Math.round((targetUTC - nowUTC) / 86400000);
  }

  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? m[3] + "/" + m[2] + "/" + m[1] : "—";
  }

  function formatDaysBadge(r) {
    if (r.status === "disconnected") return '<span class="badge disconnected">مفصول</span>';
    var d = daysFrom(r.cutDate);
    if (d === null) return '';
    if (d < 0) return '<span class="badge disconnected">متأخر ' + Math.abs(d) + ' أيام</span>';
    if (d === 0) return '<span class="badge days" style="background:var(--off-bg); color:var(--off);">ينتهي اليوم</span>';
    if (d === 1) return '<span class="badge days" style="background:var(--hold-bg); color:var(--hold);">باقي يوم واحد</span>';
    return '<span class="badge days">باقي ' + d + ' أيام</span>';
  }

  function renderTabs(all) {
    var counts = { all: all.length, active: 0, suspended: 0, disconnected: 0 };
    all.forEach(function(r) { if (counts[r.status] !== undefined) counts[r.status]++; });
    
    var defs = [
      ["all", "الكل", counts.all],
      ["active", "مفعل", counts.active],
      ["suspended", "معلق", counts.suspended],
      ["disconnected", "مفصول", counts.disconnected]
    ];

    $("tabs").innerHTML = defs.map(function(t) {
      return '<button type="button" class="tab" data-f="' + t[0] + '" aria-pressed="' + (filter === t[0]) + '">' + t[1] + ' <b>' + t[2] + '</b></button>';
    }).join("");

    $("summary").textContent = "إجمالي " + all.length + " شريحة · مرتبة حسب الحالة والتاريخ";
  }

  function matches(r) {
    if (filter !== "all" && r.status !== filter) return false;
    var q = query.trim().toLowerCase();
    if (!q) return true;
    var combined = [r.name, r.phone, r.sim, r.company, r.activation, r.notes].join(" ").toLowerCase();
    return combined.indexOf(q) !== -1;
  }

  function render() {
    checkAutoDisconnect();
    var all = Array.from(docs.values());
    renderTabs(all);

    var filtered = all.filter(matches).sort(function(a, b) {
      var sa = ORDER.indexOf(a.status), sb = ORDER.indexOf(b.status);
      if (sa !== sb) return sa - sb;
      return (a.cutDate || "") < (b.cutDate || "") ? -1 : 1;
    });

    if (!filtered.length) {
      $("list").innerHTML = '<div class="empty">لا توجد سجلات مطابقة للبحث أو التصفية الحالية.</div>';
      return;
    }

    var html = "";
    filtered.forEach(function(r) {
      var isDue = daysFrom(r.cutDate) !== null && daysFrom(r.cutDate) <= 1 && r.status === "active";
      var cleanLabel = r.simState === "clear-sim" ? "نظيفة" : "مستعملة";
      var subInfo = [r.company, r.activation ? "التفعيل: " + r.activation : "", cleanLabel].filter(Boolean).join(" · ");

      // رسالة SMS الجاهزة للإرسال
      var smsBody = encodeURIComponent(
        smsTemplate
          .replace("{name}", r.name || "العزيز")
          .replace("{phone}", r.phone || "")
          .replace("{date}", fmtDate(r.cutDate))
      );

      html += '<div class="card' + (isDue ? ' due' : '') + '">' +
        '<div class="card-header">' +
          '<div class="phone-lg">' + r.phone + '</div>' +
          formatDaysBadge(r) +
        '</div>' +
        '<div class="card-body">' +
          '<div class="name-row"><span>' + (r.name || "بدون اسم") + '</span></div>' +
          (r.sim ? '<div class="sim-row"><span>💳 ' + r.sim + '</span></div>' : '') +
          '<div class="meta-row"><span>🏢 ' + subInfo + '</span></div>' +
          (r.notes ? '<div style="font-size:.82rem; color:var(--muted); margin-top:2px;">📝 ' + r.notes + '</div>' : '') +
        '</div>' +
        '<div class="date-row">' +
          '<span>موعد الفصل: <span class="date-val">' + fmtDate(r.cutDate) + '</span></span>' +
          '<span class="badge ' + r.status + '">' + STATUS[r.status] + '</span>' +
        '</div>' +
        '<div class="card-actions">' +
          '<a class="action-btn sms" href="sms:' + r.phone + '?body=' + smsBody + '">رسالة</a>' +
          '<a class="action-btn call" href="tel:' + r.phone + '">اتصال</a>' +
          '<a class="action-btn wa" href="https://wa.me/972' + (r.phone.startsWith("0") ? r.phone.slice(1) : r.phone) + '?text=' + smsBody + '" target="_blank">واتساب</a>' +
          '<button class="action-btn edit-btn" type="button" data-id="' + r._id + '">تعديل</button>' +
        '</div>' +
      '</div>';
    });

    $("list").innerHTML = html;
  }

  // Modal handlers
  function openDlg(id) {
    editingId = id;
    delArmed = false;
    var r = id ? docs.get(id) : null;
    $("dlgTitle").innerHTML = (r ? "تعديل الشريحة" : "إضافة شريحة جديدة") + ' <button class="btn" type="button" id="closeDlg" style="padding:4px 10px;font-size:.8rem;">إغلاق</button>';
    
    $("f-name").value = r ? r.name || "" : "";
    $("f-phone").value = r ? r.phone || "" : "";
    $("f-company").value = r ? r.company || "" : "";
    $("f-sim").value = r ? r.sim || "" : "";
    $("f-activation").value = r ? r.activation || "" : "";
    $("f-status").value = r ? r.status || "active" : "active";
    $("f-simstate").value = r ? r.simState || "used-sim" : "used-sim";
    $("f-date").value = r ? r.cutDate || "" : new Date().toISOString().slice(0, 10);
    $("f-notes").value = r ? r.notes || "" : "";
    
    var del = $("delBtn");
    del.hidden = !r;
    del.textContent = "حذف";
    
    $("err").textContent = "";
    $("overlay").hidden = false;
  }

  function closeDlg() { $("overlay").hidden = true; editingId = null; }

  // Events
  $("tabs").addEventListener("click", function(e) {
    var b = e.target.closest(".tab");
    if (!b) return;
    filter = b.dataset.f;
    render();
  });

  $("q").addEventListener("input", function(e) {
    query = e.target.value;
    render();
  });

  $("addBtn").addEventListener("click", function() { openDlg(null); });
  $("closeDlg").addEventListener("click", closeDlg);
  $("overlay").addEventListener("click", function(e) { if(e.target === $("overlay")) closeDlg(); });

  $("form").addEventListener("submit", function(e) {
    e.preventDefault();
    var phone = $("f-phone").value.trim();
    if (!phone) { $("err").textContent = "يرجى إدخال رقم الهاتف."; return; }
    
    var id = editingId || ("s_" + Date.now());
    var record = {
      _id: id,
      name: $("f-name").value.trim(),
      phone: phone,
      company: $("f-company").value,
      sim: $("f-sim").value.trim(),
      activation: $("f-activation").value,
      status: $("f-status").value,
      simState: $("f-simstate").value,
      cutDate: $("f-date").value,
      notes: $("f-notes").value.trim()
    };

    docs.set(id, record);
    saveData();
    closeDlg();
    render();
    toast(editingId ? "تم تحديث السجل بنجاح" : "تمت إضافة الشريحة بنجاح");
  });

  $("delBtn").addEventListener("click", function() {
    if (!delArmed) {
      delArmed = true;
      this.textContent = "تأكيد الحذف؟";
      return;
    }
    if (editingId) {
      docs.delete(editingId);
      saveData();
      closeDlg();
      render();
      toast("تم حذف السجل");
    }
  });

  $("list").addEventListener("click", function(e) {
    var btn = e.target.closest(".edit-btn");
    if (btn) openDlg(btn.dataset.id);
  });

  // Settings Modal
  $("setBtn").addEventListener("click", function() {
    $("s-template").value = smsTemplate;
    $("setOverlay").hidden = false;
  });
  $("setClose").addEventListener("click", function() {
    smsTemplate = $("s-template").value;
    localStorage.setItem("sim_sms_tmpl", smsTemplate);
    $("setOverlay").hidden = true;
    toast("تم حفظ الإعدادات");
  });
  $("setOverlay").addEventListener("click", function(e) { if(e.target === $("setOverlay")) $("setOverlay").hidden = true; });

  // Export / Import CSV & JSON
  $("expCSV").addEventListener("click", function() {
    var rows = [["الاسم", "رقم الهاتف", "الشركة", "رقم الشريحة", "مكان التفعيل", "الحالة", "تاريخ الفصل", "ملاحظات"]];
    docs.forEach(function(r) {
      rows.push([
        '"' + (r.name || "").replace(/"/g, '""') + '"',
        '"' + (r.phone || "") + '"',
        '"' + (r.company || "") + '"',
        '"' + (r.sim || "") + '"',
        '"' + (r.activation || "") + '"',
        '"' + (STATUS[r.status] || r.status) + '"',
        '"' + (r.cutDate || "") + '"',
        '"' + (r.notes || "").replace(/"/g, '""') + '"'
      ]);
    });
    var csvContent = "\ufeff" + rows.map(e => e.join(",")).join("\n");
    var blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "sims-subscriptions-" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    toast("تم تصدير ملف الـ CSV بنجاح");
  });

  $("expJSON").addEventListener("click", function() {
    var data = JSON.stringify(Array.from(docs.values()), null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "sims-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    toast("تم تصدير النسخة الاحتياطية");
  });

  $("impBtn").addEventListener("click", function() { $("impFile").click(); });
  $("impFile").addEventListener("change", function(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(evt) {
      try {
        var parsed = JSON.parse(evt.target.result);
        if (Array.isArray(parsed)) {
          parsed.forEach(function(r) {
            if (r._id && r.phone) docs.set(r._id, r);
          });
          saveData();
          render();
          toast("تم استيراد ودمج البيانات بنجاح");
        }
      } catch(err) {
        toast("ملف غير صالح أو تالف");
      }
      $("impFile").value = "";
    };
    reader.readAsText(f);
  });

  loadData();
  render();
})();
</script>
</body>
</html>
